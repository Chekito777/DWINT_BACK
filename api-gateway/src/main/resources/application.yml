server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-a
              uri: lb://ms-a
              predicates:
                - Path=/api/entity-a/**
              filters:
                - StripPrefix=0

            - id: ms-b
              uri: lb://ms-b
              predicates:
                - Path=/api/entity-b/**
              filters:
                - StripPrefix=0

            - id: auth-server
              uri: lb://authserver
              predicates:
                - Path=/api/auth/**,/oauth2/**,/.well-known/**,/userinfo
              filters:
                - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
