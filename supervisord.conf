[supervisord]
nodaemon=true
logfile=/dev/stdout
loglevel=info

[program:eureka]
command=java -jar /app/idgs15.jar
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=10

[program:auth]
command=java -jar /app/authserver.jar
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=20

[program:ms-a]
command=java -jar /app/ms-a.jar
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=30

[program:ms-b]
command=java -jar /app/ms-b.jar
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=30

[program:gateway]
command=java -jar /app/api-gateway.jar
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
priority=40